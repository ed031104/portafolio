<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Contacto Portfolio</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      color: #000000;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        background-color: #e8e8e8;
        padding: 40px 20px;
      "
    >
      <tr>
        <td align="center">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 640px;
              background-color: #ffffff;
              border-radius: 24px;
              overflow: hidden;
              border: 1px solid #e8e8e8;
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background-color: #dbe7fb;
                  padding: 32px;
                  border-bottom: 1px solid #e8e8e8;
                "
              >
                <table cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td valign="middle">
                      <img
                        src="https://avatars.githubusercontent.com/u/124459504?v=4&size=64"
                        width="48"
                        height="48"
                        alt="Avatar"
                        style="
                          border-radius: 50%;
                          display: block;
                        "
                      />
                    </td>

                    <td width="16"></td>

                    <td valign="middle">
                      <h1
                        style="
                          margin: 0;
                          font-size: 20px;
                          font-weight: 600;
                          color: #000000;
                        "
                      >
                        Contacto de Portfolio
                      </h1>

                      <p
                        style="
                          margin: 6px 0 0 0;
                          font-size: 14px;
                          color: #949494;
                        "
                      >
                        Tienes un nuevo mensaje
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding: 32px">
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      width="50%"
                      valign="top"
                      style="padding-bottom: 24px"
                    >
                      <p
                        style="
                          margin: 0 0 6px 0;
                          font-size: 14px;
                          color: #949494;
                        "
                      >
                        De:
                      </p>

                      <p
                        style="
                          margin: 0;
                          font-size: 16px;
                          font-weight: 500;
                          color: #000000;
                        "
                      >
                        @contact
                      </p>
                    </td>

                    <td
                      width="50%"
                      valign="top"
                      style="padding-bottom: 24px"
                    >
                      <p
                        style="
                          margin: 0 0 6px 0;
                          font-size: 14px;
                          color: #949494;
                        "
                      >
                        Email:
                      </p>

                      <p
                        style="
                          margin: 0;
                          font-size: 16px;
                          font-weight: 500;
                          color: #277eff;
                        "
                      >
                        @emailcontact
                      </p>
                    </td>
                  </tr>
                </table>

                <!-- Message -->
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="
                    border-top: 1px solid #e8e8e8;
                    padding-top: 24px;
                  "
                >
                  <tr>
                    <td>
                      <p
                        style="
                          margin: 0 0 12px 0;
                          font-size: 14px;
                          color: #949494;
                        "
                      >
                        Mensaje:
                      </p>

                      <p
                        style="
                          margin: 0;
                          font-size: 16px;
                          line-height: 1.7;
                          color: rgba(0, 0, 0, 0.9);
                          white-space: pre-wrap;
                        "
                      >
                        @message
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                align="center"
                style="
                  background-color: #e8e8e8;
                  padding: 20px;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    color: #949494;
                  "
                >
                  © 2026 Tu Portfolio. Todos los derechos reservados.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
